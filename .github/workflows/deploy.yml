name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so CI and local cannot drift. react-router 8
          # requires >= 22.22.0, which plain "22" does not guarantee.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests with coverage thresholds
        run: npm run coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Flat-mode end-to-end tests
        run: npm run e2e

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
