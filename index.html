<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paul Kim — XR</title>
    <meta name="description" content="Personal homepage and WebXR lab of Paul Kim." />
    <!-- spa-github-pages decode: 404.html redirects /p/foo to /?/p/foo, and this
         rewrites it back before React Router ever sees the location. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        /* dvh, not %: mobile browsers grow and shrink the visible viewport as
           their toolbars slide away, and a percentage of a height that is
           itself changing leaves a strip of page showing under the canvas.
           The percentage stays as the fallback for anything without dvh. */
        height: 100%;
        height: 100dvh;
        background: #000;
        overflow: hidden;
        /* No rubber-banding or pull-to-refresh on a page that cannot scroll. */
        overscroll-behavior: none;
      }
      body {
        font-family: system-ui, sans-serif;
        color: #fff;
      }
      canvas {
        /* The hub reads horizontal drags to browse, and OrbitControls reads
           them to look around. Left to itself the browser claims those first,
           for panning and pull-to-refresh, and the gesture never reaches the
           page.

           !important because OrbitControls writes `touch-action: auto` inline
           on the canvas when it disconnects, and an inline declaration beats a
           plain rule. Forcing it is what OrbitControls itself wants — it sets
           `none` whenever it is connected. */
        touch-action: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
